<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Objetos UDB</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark navbar-udb">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            🔎 Objetos UDB

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Inicio

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="login.html">

                        Iniciar sesión

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-lg">

                <div class="card-body p-4">


                    <div class="text-center mb-4">

                        <div class="icono">
                            👤
                        </div>

                        <h2>
                            Crear cuenta
                        </h2>

                        <p class="text-muted">
                            Regístrate para utilizar el sistema
                        </p>

                    </div>


                    <div
                        id="mensaje"
                        class="alert d-none">
                    </div>


                    <form id="formRegistro">


                        <div class="row">


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="nombre">

                                    Nombre

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    placeholder="Andrea">

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    class="form-label"
                                    for="apellido">

                                    Apellido

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="apellido"
                                    placeholder="Jiménez">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="carnet">

                                Carnet

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="carnet"
                                placeholder="Ejemplo: 2019001234">

                        </div>

                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="carrera">

                                Carrera

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="carrera"
                                placeholder="Ejemplo: Ingeniería en Sistemas">  


                        </div>



                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="correo">

                                Correo electrónico

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correo"
                                placeholder="nombre@udb.edu.sv">

                        </div>



                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="password">

                                Contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Mínimo 6 caracteres">

                        </div>



                        <div class="mb-4">

                            <label
                                class="form-label"
                                for="confirmarPassword">

                                Confirmar contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmarPassword"
                                placeholder="Repita su contraseña">

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Crear cuenta

                        </button>


                    </form>


                    <div class="text-center mt-4">

                        <p>

                            ¿Ya tienes una cuenta?

                            <a href="login.html">
                                Inicia sesión
                            </a>

                        </p>

                    </div>


                </div>

            </div>

        </div>

    </div>

</main>



<script src="js/auth.js"></script>

<script src="js/validaciones.js"></script>


<script>

document
    .getElementById("formRegistro")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const nombre =
            document.getElementById("nombre").value.trim();

        const apellido =
            document.getElementById("apellido").value.trim();

        const carnet =
            document.getElementById("carnet").value.trim();

        const carrera =
            document.getElementById("carrera").value.trim();

        const correo =
            document.getElementById("correo").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmar =
            document.getElementById("confirmarPassword").value;


        const mensaje =
            document.getElementById("mensaje");


        mensaje.className =
            "alert d-none";


        // Campos obligatorios

        if (
            !nombre ||
            !apellido ||
            !carnet ||
            !carrera ||
            !correo ||
            !password ||
            !confirmar
        ) {

            mostrarError(
                mensaje,
                "Todos los campos son obligatorios."
            );

            return;
        }


        // Correo

        if (!validarCorreo(correo)) {

            mostrarError(
                mensaje,
                "Ingresa un correo electrónico válido."
            );

            return;
        }


        // Contraseña

        if (!validarPassword(password)) {

            mostrarError(
                mensaje,
                "La contraseña debe tener al menos 6 caracteres."
            );

            return;
        }


        // Confirmar contraseña

        if (password !== confirmar) {

            mostrarError(
                mensaje,
                "Las contraseñas no coinciden."
            );

            return;
        }


        // Registrar

        const resultado =
            registrarUsuario(
                nombre,
                apellido,
                carnet,
                carrera,
                correo,
                password
            );


        if (!resultado.correcto) {

            mostrarError(
                mensaje,
                resultado.mensaje
            );

            return;
        }


        // Éxito

        mensaje.className =
            "alert alert-success";

        mensaje.textContent =
            "¡Cuenta creada correctamente!";


        document
            .getElementById("formRegistro")
            .reset();


        setTimeout(function() {

            window.location.href = "login.html";

        }, 1500);

    });

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark navbar-udb">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🔎 Objetos UDB
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="registro.html">
                        Registrarse
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- LOGIN -->

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div class="icono">
                            🔐
                        </div>

                        <h2>
                            Iniciar sesión
                        </h2>

                        <p class="text-muted">
                            Accede al sistema de objetos UDB
                        </p>

                    </div>


                

                    <div
                        id="mensajeError"
                        class="alert alert-danger d-none">
                    </div>


                    <form id="formLogin">


                       

                        <div class="mb-3">

                            <label
                                for="correo"
                                class="form-label">

                                Correo electrónico

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correo"
                                placeholder="ejemplo@udb.edu.sv">

                        </div>

                        <div class="mb-3">

                            <label
                                for="carnet"
                                class="form-label">

                                Carnet

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="carnet"
                                placeholder="Ejemplo: 2019001234JKYF">

                        </div>

                        

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                Contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Ingrese su contraseña">

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Iniciar sesión

                        </button>


                    </form>


                    <div class="text-center mt-4">

                        <p>
                            ¿No tienes una cuenta?
                            <a href="registro.html">
                                Regístrate aquí
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>



<script src="js/auth.js"></script>

<script src="js/validaciones.js"></script>


<script>

document
    .getElementById("formLogin")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const correo =
            document.getElementById("correo").value.trim();

        const carnet =
            document.getElementById("carnet").value.trim();

        const password =
            document.getElementById("password").value;


        const mensaje =
            document.getElementById("mensajeError");


        ocultarError(mensaje);


        // Valida correo

        if (!validarCampo(correo)) {

            mostrarError(
                mensaje,
                "Por favor ingresa tu correo."
            );

            return;
        }


        if (!validarCorreo(correo)) {

            mostrarError(
                mensaje,
                "Ingresa un correo electrónico válido."
            );

            return;
        }


        // Valida carnet

        if (!validarCampo(carnet)) {

            mostrarError(
                mensaje,
                "Por favor ingresa tu carnet estudiantil."
            );

            return;
        }


        // Valida contraseña

        if (!validarCampo(password)) {

            mostrarError(
                mensaje,
                "Por favor ingresa tu contraseña."
            );

            return;
        }


       

        // Intentar iniciar sesión

        const resultado =
           iniciarSesion(
            carnet,
            correo,
            password
        );


if (!resultado.correcto) {

    mostrarError(
        mensaje,
        resultado.mensaje
    );

    return;
    }

        // Redireccionar del rol

        if (resultado.usuario.rol === "admin") {

            window.location.href = "admin.html";

        } else {

            window.location.href = "dashboard.html";

        }

    });

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
